[package]
name = "canvascode-studio"
version = "1.0.0"
description = "CanvasCode Studio - Visual Micro-Adjustment & Multimodal AI Design Workbench"
authors = ["Allen <@al1830329386-dev>"]
license = "GPL-3.0"
repository = "https://github.com/al1830329386-dev/canvascode"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "canvascode-studio"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
